name: Python CI/CD

on:
  push:
    branches:
      - main

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Install Python dependencies
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # Step 4: Run unit tests
      - name: Run tests
        run: |
          python -m pytest

      # Step 5: Build Docker image
      - name: Build Docker image
        run: |
          docker build -t devops-practice:${{ github.sha }} .

      # Step 6: Run Docker container
      - name: Run Docker container
        run: |
          docker run -d --name devops-test -p 5000:5000 devops-practice:${{ github.sha }}

      # Step 7: Test application inside Docker container
      - name: Test Docker container
        run: |
          sleep 5
          curl http://localhost:5000

      # Step 8: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 9: Tag Docker image for Docker Hub
      - name: Tag Docker image
        run: |
          docker tag devops-practice:${{ github.sha }} rudrach10/devops-practice:${{ github.sha }}

      # Step 10: Push Docker image to Docker Hub
      - name: Push Docker image
        run: |
          docker push rudrach10/devops-practice:${{ github.sha }}
